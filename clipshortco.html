<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Get Link with Ad</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 50px;
        }
        #ad-container {
            display: none;
            margin-top: 20px;
            padding: 20px;
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
            border-radius: 5px;
        }
        #final-link {
            display: none;
            margin-top: 20px;
            font-size: 18px;
        }
    </style>
</head>
<body>

    <h2>Click the button to get the link</h2>
    <button id="getLinkBtn">Click Here to Get Link</button>

    <div id="ad-container">
        <p><strong>Advertisement</strong></p>
        <p>Check out our latest offers! (Wait for 5 seconds...)</p>
    </div>

    <p id="final-link">
        <a href="https://clipshort.co" target="_blank">Go to Clip Short</a>
    </p>

    <script>
        document.getElementById("getLinkBtn").addEventListener("click", function() {
            this.style.display = "none";  // Hide button
            let adContainer = document.getElementById("ad-container");
            adContainer.style.display = "block";  // Show ad
            
            setTimeout(function() {
                adContainer.style.display = "none";  // Hide ad
                document.getElementById("final-link").style.display = "block";  // Show link
            }, 5000);  // Wait 5 seconds
        });
    </script>

</body>
</html>
