    <div class="contact-content font1 max-width-1 m-auto">
        <div class="max-width-1 m-auto mx-1">
            <h2>Feel Free to Contact Us</h2>
            <form id="contact-form"> <!-- FORM STARTS HERE -->
                <div class="form-box">
                    <input type="text" name="user_name" placeholder="Enter Your Name" required>
                </div>
                <div class="form-box">
                    <input type="text" name="user_phone" placeholder="Enter Your Phone Number" required>
                </div>
                <div class="form-box">
                    <input type="email" name="user_email" placeholder="Enter Your Email Id" required>
                </div>
                <div class="form-box">
                    <textarea name="user_message" cols="30" rows="10" placeholder="How may we help you?" required></textarea>
                </div>
                <div class="form-box">
                    <button type="submit" class="btn">Submit</button>
                </div>
            </form> <!-- FORM ENDS HERE -->
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.emailjs.com/dist/email.min.js"></script>

    <script>
        document.addEventListener("DOMContentLoaded", function() {
            emailjs.init("8NXvnAEVhmwHrXEPr"); // Replace with your actual EmailJS Public Key

            document.querySelector("#contact-form").addEventListener("submit", function(event) {
                event.preventDefault(); // Prevent page reload

                let name = document.querySelector("input[name='user_name']").value.trim();
                let phone = document.querySelector("input[name='user_phone']").value.trim();
                let email = document.querySelector("input[name='user_email']").value.trim();
                let message = document.querySelector("textarea[name='user_message']").value.trim();

                if (!name || !phone || !email || !message) {
                    Swal.fire("Error!", "Please fill all fields!", "error");
                    return;
                }

                // Send email via EmailJS
                emailjs.send("service_3iz7isd","template_bjs8mht", {
                    user_name: name,
                    user_phone: phone,
                    user_email: email,
                    user_message: message,
                }).then(function(response) {
                    Swal.fire("Success!", "Your message has been sent!", "success");
                    document.querySelector("#contact-form").reset(); // Clear the form
                }).catch(function(error) {
                    Swal.fire("Oops!", "Something went wrong. Try again!", "error");
                });
            });
        });
    </script>
